<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>은우 좀비서바이벌 3D - 새 엔진</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd4ed;font-family:system-ui,-apple-system,sans-serif;touch-action:none;color:#fff}button{font:inherit;cursor:pointer;touch-action:manipulation}#game{position:fixed;inset:0}#game canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}#hud{position:absolute;top:max(15px,env(safe-area-inset-top));left:14px;right:14px;display:none;text-shadow:0 2px 3px #283a5b;font-weight:800}#health{height:16px;background:#382a46a0;border:2px solid white;border-radius:15px;overflow:hidden;width:min(230px,55vw);margin-top:5px}#healthFill{height:100%;background:linear-gradient(90deg,#ff668b,#ffcf76);width:100%}#objective{margin-top:8px;background:#17354d9c;border-radius:10px;padding:7px 11px;display:inline-block;font-size:13px}#joy{position:absolute;left:22px;bottom:25px;width:125px;height:125px;border:3px solid #fff9;background:#82b8dd88;border-radius:50%;display:none;pointer-events:auto;touch-action:none;box-shadow:0 4px 12px #314a5b6b}#knob{position:absolute;left:37px;top:37px;width:45px;height:45px;background:linear-gradient(145deg,#fff,#74c8f7);border-radius:50%;box-shadow:0 2px 8px #284c6b}#attack{position:absolute;right:26px;bottom:40px;width:100px;height:100px;border-radius:50%;border:4px solid white;background:linear-gradient(145deg,#ffdf86,#ff7d62);color:#623b30;font-size:24px;font-weight:900;display:none;pointer-events:auto}#panel{position:absolute;inset:0;background:linear-gradient(160deg,#70c8efee,#8d86ddec);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;overflow:auto;padding:35px 14px 80px;pointer-events:auto;text-align:center}h1{font-size:clamp(27px,7vw,45px);margin:8px 0 0;color:#fff9d9;text-shadow:0 4px 0 #526db4}h2{margin:5px 0}p{margin:5px}.card{background:#203c66c9;border:2px solid #d7f2ff;border-radius:17px;padding:14px;width:min(650px,100%)}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.choices button,.primary{border:2px solid #fff;background:#effaff;color:#284c75;border-radius:12px;padding:12px 15px;font-weight:800}.choices button.on{background:#ffcf75;color:#643e33;border-color:#fff3bd}.primary{background:#ffca63;font-size:20px;box-shadow:0 5px 0 #b77b40;min-width:190px}.small{font-size:13px;opacity:.95}#error{position:absolute;top:20%;left:10%;width:80%;background:#4b1d38;color:white;padding:16px;border-radius:12px;display:none;pointer-events:none;white-space:pre-wrap}#win{position:absolute;inset:0;background:#2b476ad9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;pointer-events:auto}#win button{padding:15px;border-radius:12px;border:2px solid white;background:#ffcd6b;font-weight:bold}@media(min-width:800px){#joy{left:8%;bottom:7%}#attack{right:8%;bottom:8%}}
</style></head><body><div id="game"></div><div id="ui"><div id="hud"><div id="stageName"></div><div id="health"><div id="healthFill"></div></div><div id="objective"></div></div><div id="joy"><div id="knob"></div></div><button id="attack">⚔️<br>공격</button><div id="panel"><h1>🌟 은우 좀비서바이벌 3D</h1><p>귀여운 3D 던전 액션 모험</p><div class="card"><h2>🌍 세계 선택</h2><div id="worlds" class="choices"></div></div><div class="card"><h2>🗺️ 스테이지</h2><div id="stages" class="choices"></div></div><div class="card"><h2>⚔️ 직업 선택</h2><div id="tiers" class="choices"></div><div id="classes" class="choices" style="margin-top:10px"></div></div><div class="card"><div id="bossInfo"></div></div><button class="primary" id="start">▶ 게임 시작</button><p class="small">왼쪽 조이스틱 이동 · 오른쪽 공격 · 좀비 전부 처치 후 보스 등장</p></div><div id="win"><h1>🏆 스테이지 클리어!</h1><p>좀비와 보스를 모두 물리쳤어!</p><button id="next">다음 스테이지 ▶</button><button id="menu">스테이지 선택</button></div><div id="error"></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const worlds=['🏙️ 좀비 도시','🎃 할로윈 나이트','❄️ 얼음왕국','🌋 볼케이노 마을'];
const bosses=[['🧟 좀비 대장','☠️ 독가스 군주','👑 감염된 왕','🦾 철갑 거인','🧪 돌연변이','💀 사령술사','🔥 폭주 좀비','👁️ 심연의 눈','⚡ 번개 폭군','🐉 최종 군주'],['🎃 호박 대왕','👻 유령 기사','🦇 박쥐 여왕','🕸️ 거미 군주','🧙 어둠 마녀','💀 해골 왕','🕯️ 저주 인형','🐺 늑대 괴물','🪄 마법 폭군','👑 할로윈 제왕'],['❄️ 얼음 골렘','🐺 설원 늑대왕','🧊 서리 기사','👑 눈의 여왕','🐻 얼음 곰왕','🌨️ 눈보라 정령','🐉 설룡','💎 수정 거인','⚔️ 빙하 장군','👑 영원의 겨울'],['🌋 용암 골렘','🔥 불꽃 악마','🦂 화산 전갈','🐲 화염룡','💣 폭발 거인','🗿 마그마 수호자','☄️ 운석 괴물','👹 지옥 군주','🌋 화산의 심장','👑 종말의 제왕']];
const tierNames=['일반','희귀','영웅','전설','신화','GOD'];
const classes=[['🫧 구슬 용사',0,1],['🏹 궁수',0,1.2],['🛡️ 기사',1,1.35],['💣 폭탄병',1,1.45],['⚡ 번개 마법사',2,1.65],['❄️ 얼음 마법사',2,1.7],['🗡️ 그림자 암살자',3,2],['🐉 드래곤 기사',4,2.4],['👑 신의 수호자',5,3]];
let world=0,stage=1,tier=0,cls=0,playing=false,game=null,TH=null,scene,camera,renderer,hero,ground,entities=[],enemies=[],shots=[],walls=[],life=100,spawned=0,bossSpawned=false,bossDead=false,last=0,fireCooldown=0,keys={},joy={x:0,y:0},attackHeld=false,enemyTimer=0;
function button(label,active,fn){let b=document.createElement('button');b.textContent=label;if(active)b.className='on';b.onclick=fn;return b}
function menus(){let w=$('worlds');w.replaceChildren();worlds.forEach((x,i)=>w.appendChild(button(x,world===i,()=>{world=i;stage=1;menus()})));let st=$('stages');st.replaceChildren();for(let i=1;i<=10;i++)st.appendChild(button(world+1+'-'+i,stage===i,()=>{stage=i;menus()}));let t=$('tiers');t.replaceChildren();tierNames.forEach((x,i)=>t.appendChild(button(x,tier===i,()=>{tier=i;menus()})));let c=$('classes');c.replaceChildren();classes.forEach((x,i)=>{if(x[1]===tier)c.appendChild(button(x[0],cls===i,()=>{cls=i;menus()}))});$('bossInfo').textContent='👑 '+(world+1)+'-'+stage+' 보스: '+bosses[world][stage-1]+' · 일반 좀비를 전부 처치하면 등장!'}
menus();
function fail(msg){$('error').style.display='block';$('error').textContent=msg;console.error(msg)}
function load3D(){return new Promise((resolve,reject)=>{if(window.THREE)return resolve(window.THREE);const urls=['https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];let i=0;function next(){if(window.THREE)return resolve(window.THREE);if(i===urls.length)return reject(Error('3D 엔진을 불러오지 못했습니다. 인터넷 연결 또는 Safari 콘텐츠 차단을 확인하세요.'));let s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.THREE?resolve(window.THREE):next();s.onerror=next;document.head.appendChild(s)}next()})}
function material(color){return new TH.MeshLambertMaterial({color})}
function mesh(geometry,color,x,y,z){let o=new TH.Mesh(geometry,material(color));o.position.set(x,y,z);scene.add(o);entities.push(o);return o}
function box(x,z,w,d,h,color){let o=mesh(new TH.BoxGeometry(w,h,d),color,x,h/2,z);walls.push({x,z,w,d});return o}
function sphere(x,y,z,r,color){return mesh(new TH.SphereGeometry(r,16,12),color,x,y,z)}
function build(){
TH=window.THREE;scene=new TH.Scene();scene.background=new TH.Color([0xa6dff5,0x9976bf,0xa8dff8,0xf7a576][world]);
camera=new TH.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);
renderer=new TH.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);$('game').replaceChildren(renderer.domElement);
scene.add(new TH.HemisphereLight(0xffffff,0x8e92b2,2.5));let sun=new TH.DirectionalLight(0xfff1d5,1.4);sun.position.set(-8,18,10);scene.add(sun);
const floorColors=[0x8bd5a2,0xb49add,0xb9e8ef,0xf3b078],wallColors=[0xf3d28f,0x76549d,0xe7f7fc,0x9c5948];
ground=mesh(new TH.PlaneGeometry(42,42),floorColors[world],0,0,0);ground.rotation.x=-Math.PI/2;
for(let i=-20;i<=20;i+=4){mesh(new TH.BoxGeometry(.05,.02,40),0xffffff,i,.01,0);mesh(new TH.BoxGeometry(40,.02,.05),0xffffff,0,.01,i)}
walls=[];box(0,-20,40,1,2.3,wallColors[world]);box(0,20,40,1,2.3,wallColors[world]);box(-20,0,1,40,2.3,wallColors[world]);box(20,0,1,40,2.3,wallColors[world]);
[[-8,-6,5,2],[8,-6,5,2],[-9,8,3,4],[9,8,3,4],[0,11,5,2]].forEach(a=>box(a[0],a[1],a[2],a[3],1.3,wallColors[world]));
hero=new TH.Group();let body=new TH.Mesh(new TH.SphereGeometry(.8,22,16),new TH.MeshPhongMaterial({color:0xffdb84,shininess:85}));body.position.y=.9;hero.add(body);
for(let side of [-1,1]){let eye=new TH.Mesh(new TH.SphereGeometry(.1,8,8),new TH.MeshBasicMaterial({color:0x24385c}));eye.position.set(side*.26,1.03,.7);hero.add(eye)}
let smile=new TH.Mesh(new TH.BoxGeometry(.28,.035,.035),new TH.MeshBasicMaterial({color:0x8d4b4d}));smile.position.set(0,.72,.77);hero.add(smile);scene.add(hero);hero.position.set(0,0,0);
enemies=[];shots=[];life=100;spawned=0;bossSpawned=false;bossDead=false;fireCooldown=0;enemyTimer=0;last=performance.now();
}
function spawn(boss){let a=Math.random()*Math.PI*2,r=15,x=Math.cos(a)*r,z=Math.sin(a)*r;let mob=new TH.Group(),sz=boss?1.6:1;
let torso=new TH.Mesh(new TH.BoxGeometry(sz*1.1,sz*1.2,sz*.85),material(boss?0xf26987:0x71b973));torso.position.y=sz*.95;mob.add(torso);
let head=new TH.Mesh(new TH.BoxGeometry(sz*.88,sz*.83,sz*.85),material(boss?0xffb8a2:0xa7dd8d));head.position.y=sz*1.95;mob.add(head);
for(let side of [-1,1]){let eye=new TH.Mesh(new TH.BoxGeometry(.12*sz,.13*sz,.06*sz),new TH.MeshBasicMaterial({color:0x2b3745}));eye.position.set(side*.23*sz,sz*2.05,sz*.45);mob.add(eye)}
mob.position.set(x,0,z);scene.add(mob);enemies.push({obj:mob,hp:boss?18+stage*3:2+Math.floor(stage/4),speed:boss?1.5:1.1+stage*.08,boss,hit:0})}
function moveOK(x,z){if(Math.abs(x)>18.8||Math.abs(z)>18.8)return false;return !walls.some(w=>Math.abs(x-w.x)<w.w/2+.65&&Math.abs(z-w.z)<w.d/2+.65)}
function shoot(){if(fireCooldown>0||!enemies.length)return;let target=enemies.reduce((a,b)=>a.obj.position.distanceTo(hero.position)<b.obj.position.distanceTo(hero.position)?a:b);let dx=target.obj.position.x-hero.position.x,dz=target.obj.position.z-hero.position.z,d=Math.hypot(dx,dz)||1;let ball=sphere(hero.position.x,1.05,hero.position.z,.25,0xfff08c);shots.push({obj:ball,vx:dx/d*14,vz:dz/d*14,life:2});fireCooldown=.36/classes[cls][2]}
function clearGame(){playing=false;$('hud').style.display='none';$('joy').style.display='none';$('attack').style.display='none';$('win').style.display='flex'}
function tick(now){requestAnimationFrame(tick);if(!playing||!renderer)return;let dt=Math.min((now-last)/1000,.05);last=now;try{
let dx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dz=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dz);
if(len>.1){dx/=Math.max(1,len);dz/=Math.max(1,len);let speed=6*dt,nx=hero.position.x+dx*speed,nz=hero.position.z+dz*speed;if(moveOK(nx,hero.position.z))hero.position.x=nx;if(moveOK(hero.position.x,nz))hero.position.z=nz;hero.rotation.y=Math.atan2(dx,dz)}
hero.children[0].position.y=.9+Math.sin(now*.009)*.05;
enemyTimer+=dt;const total=5+stage*2;if(spawned<total&&enemyTimer>.7){spawn(false);spawned++;enemyTimer=0}
if(spawned===total&&enemies.length===0&&!bossSpawned){spawn(true);bossSpawned=true}
fireCooldown-=dt;if(attackHeld||enemies.length)shoot();
for(let e of enemies){if(e.hp<=0)continue;let v=hero.position.clone().sub(e.obj.position),dist=Math.hypot(v.x,v.z)||1;if(dist>1.25){let nx=e.obj.position.x+v.x/dist*e.speed*dt,nz=e.obj.position.z+v.z/dist*e.speed*dt;if(moveOK(nx,nz)){e.obj.position.x=nx;e.obj.position.z=nz}}else{e.hit-=dt;if(e.hit<=0){life=Math.max(0,life-(e.boss?16:6));e.hit=.9}}e.obj.rotation.y=Math.atan2(v.x,v.z)}
for(let i=shots.length-1;i>=0;i--){let b=shots[i];b.obj.position.x+=b.vx*dt;b.obj.position.z+=b.vz*dt;b.life-=dt;let hit=enemies.find(e=>Math.hypot(e.obj.position.x-b.obj.position.x,e.obj.position.z-b.obj.position.z)<(e.boss?1.4:.85));if(hit){hit.hp--;b.life=0;if(hit.hp<=0){scene.remove(hit.obj);enemies.splice(enemies.indexOf(hit),1);if(hit.boss)bossDead=true}}if(b.life<=0){scene.remove(b.obj);shots.splice(i,1)}}
camera.position.lerp(new TH.Vector3(hero.position.x+12,21,hero.position.z+17),.1);camera.lookAt(hero.position.x,0,hero.position.z);
$('healthFill').style.width=life+'%';$('objective').textContent=bossSpawned?(bossDead?'🏆 보스 처치 완료':'👑 보스 등장! 처치하세요'):'🧟 좀비 처치 '+(total-spawned+enemies.length)+'마리 남음';
renderer.render(scene,camera);if(bossDead){clearGame()}else if(life<=0){playing=false;$('panel').style.display='flex';$('hud').style.display='none';$('joy').style.display='none';$('attack').style.display='none';alert('체력이 다했어! 다시 도전해 보자.')}
}catch(e){playing=false;fail('게임 오류: '+(e.stack||e.message||e))}}
requestAnimationFrame(tick);
$('start').onclick=async()=>{try{$('start').disabled=true;$('start').textContent='3D 준비 중...';await load3D();build();playing=true;$('panel').style.display='none';$('hud').style.display='block';$('joy').style.display='block';$('attack').style.display='block';$('stageName').textContent=(world+1)+'-'+stage+' '+worlds[world]+' · '+classes[cls][0];$('error').style.display='none';}catch(e){fail('3D 시작 실패: '+e.message)}finally{$('start').disabled=false;$('start').textContent='▶ 게임 시작'}};
$('menu').onclick=()=>{$('win').style.display='none';$('panel').style.display='flex';menus()};
$('next').onclick=()=>{if(stage<10)stage++;else{stage=1;world=(world+1)%4}$('win').style.display='none';$('panel').style.display='flex';menus()};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')attackHeld=true});window.addEventListener('keyup',e=>{keys[e.key]=false;if(e.code==='Space')attackHeld=false});
let pid=null;const joyEl=$('joy');function joyDrag(e){if(e.pointerId!==pid)return;e.preventDefault();let r=joyEl.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),m=Math.min(1,d/45);joy.x=d?x/d*m:0;joy.y=d?y/d*m:0;$('knob').style.transform='translate('+(joy.x*38)+'px,'+(joy.y*38)+'px)'}
joyEl.addEventListener('pointerdown',e=>{pid=e.pointerId;try{joyEl.setPointerCapture(pid)}catch(_){}joyDrag(e)});joyEl.addEventListener('pointermove',joyDrag);function reset(){pid=null;joy.x=0;joy.y=0;$('knob').style.transform='none'}['pointerup','pointercancel','lostpointercapture'].forEach(t=>joyEl.addEventListener(t,reset));
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attackHeld=true;shoot()});['pointerup','pointercancel','pointerleave'].forEach(t=>$('attack').addEventListener(t,()=>attackHeld=false));
window.addEventListener('resize',()=>{if(renderer&&camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
})();
</script></body></html>
